# TOMC-Keep Advancing — 共享版本钉选（单一事实来源）
# 各 loader 子项目在 build.gradle 里读取本文件，避免版本号散落多处。

group=io.github.thatone0502.keepadvancing

# 模组版本号前 3 段：用户 m00942 定为 0.1.0。
# 完整产物名 = tomc-<modid>-0.1.0.<构建次数>-fabric+mc1.21.11.jar，
# 第 4 段由各子项目自己的 build-number.txt 累加（见 fabric-1.21.11/build.gradle）。
mod_version=0.1.0

# ── Fabric 线（来自 minecraft-fabric-mod 技能，2026-09 核对；升级前请查 maven.fabricmc.net）
fabric_mc_version=1.21.11
fabric_loader_version=0.19.3
fabric_loom_version=1.17.19
fabric_api_version=0.141.6+1.21.11
fabric_java_version=21
