# TOMC-Keep Advancing — Fabric × MC 1.21.11
#
# 本子项目是 PLAN.md §2 扩展路线中的第一格（D1：先单目标打通，再逐格扩展）。
# 版本钉选：本文件是这一格的**独立事实来源**（本目录自带 gradlew，可单独构建交付）；
# 根目录 ../root.gradle.properties 保留全局副本，升级 MC 时两处同时改。
#
# 升级前请查官方源：https://maven.fabricmc.net/ （loom / loader / fabric-api）

# ── Gradle 运行时 ───────────────────────────────────────────────────────────
# PATH 上的 java.exe 是本机 JDK 8（Oracle javapath），Gradle 9 要求 JVM ≥ 17，
# 故显式指定启动 Gradle 的 JVM（与 build.gradle 的 toolchain 目标 21 一致）。
org.gradle.java.home=C:/Program Files/Java/jdk-21.0.5+11
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# configuration-cache=false 是 loom 已知 issue #1349 的官方示例做法，勿改回 true。
org.gradle.configuration-cache=false

# ── Fabric 1.21.11 钉选 ─────────────────────────────────────────────────────
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.141.6+1.21.11
java_version=21

# ── 产物命名 ───────────────────────────────────────────────────────────────
# 产物名格式（用户 m00942 规定）：
#   tomc-<modid>-<主版本>.<次版本>.<修订号>.<构建次数>-<平台>+mc<mc版本号>.jar
#   例：tomc-keepadvancing-0.1.0.0-fabric+mc1.21.11.jar
# mod_version 只写前 3 段（改版本号改这里）。第 4 段"构建次数"由 build.gradle 从
# 本目录的 build-number.txt 自动累加：每次 jar 真正产出后 +1。
# 要复现某个既有产物名、不消耗也不写回编号：gradlew build -PbuildNumber=7
mod_id=keepadvancing
mod_name=TOMC-Keep Advancing
mod_version=0.1.0
group=io.github.thatone0502.keepadvancing
